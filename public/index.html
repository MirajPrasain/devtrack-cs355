<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTrack — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <h1>Dev<span>Track</span></h1>
      <p>// track your coding journey</p>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="form-group">
          <label>USERNAME</label>
          <input type="text" id="loginUsername" placeholder="your username">
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Login</button>
        <p class="msg" id="loginMsg"></p>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerForm" style="display:none">
        <div class="form-group">
          <label>USERNAME</label>
          <input type="text" id="regUsername" placeholder="choose a username">
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="regPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" onclick="handleRegister()">Create Account</button>
        <p class="msg" id="registerMsg"></p>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
