<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTrack — Pair Session</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; }
    .pair-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; width: 100%; max-width: 700px; }
    .pair-box h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
    .pair-box p { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; margin-bottom: 24px; }
    .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    video { width: 100%; border-radius: 10px; background: #000; aspect-ratio: 4/3; }
    .video-label { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; }
    .controls input { flex: 1; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Syne', sans-serif; outline: none; }
    .controls input:focus { border-color: var(--accent); }
    .btn-rtc { padding: 12px 20px; border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-call { background: var(--accent); color: white; }
    .btn-join { background: var(--accent2); color: #0a0a0f; }
    .btn-end  { background: var(--danger); color: white; }
    .btn-back { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 600; }
    .status { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent2); min-height: 20px; }
  </style>
</head>
<body>
  <div class="pair-box">
    <h2>🎥 Pair Session</h2>
    <p>// peer-to-peer coding session via WebRTC</p>

    <div class="videos">
      <div>
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="video-label">you</div>
      </div>
      <div>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="video-label">peer</div>
      </div>
    </div>

    <p class="status" id="status">// waiting...</p>

    <div class="controls">
      <input type="text" id="sessionId" placeholder="session ID (share with peer)">
      <button class="btn-rtc btn-call" onclick="startCall()">Start Call</button>
      <button class="btn-rtc btn-join" onclick="joinCall()">Join Call</button>
      <button class="btn-rtc btn-end"  onclick="endCall()">End</button>
    </div>
  </div>

  <button class="btn-back" onclick="window.location.href='/dashboard.html'">← Back to Dashboard</button>

  <script src="/js/rtc.js"></script>
</body>
</html>
